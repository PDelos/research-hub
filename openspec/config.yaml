schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
# Vision, roadmap and the full design rationale live in PLAN.md (read it for any new change).
context: |
  Research Hub: a self-hosted research assistant (AI + bioinformatics, neural networks). One container
  = one research project (one theme); a new theme is a new container, never a second project inside one.
  The project's proactive pi-durable agent sweeps papers daily, presents a few paper cards, learns from
  the user's 👎/👍/⭐ + reason, and grows an Obsidian-compatible vault (the KB), viewable in the browser
  through the Library view or the optional Obsidian add-on. The goal (EVOLUTION.md §0): a daily cycle that runs
  itself and keeps improving its finding loop, while the user only reads, judges and comments.

  Fixed decisions:
  - Fresh codebase. The durable-agent and jev packages are vendored from
    disler/pi-durable-news-agent (MIT, provenance in NOTICE.md); its other files are references only.
    Keep its patterns (durable tasks with checkpointed phases, onceInCommit tools, Jev commands as
    versioned JSON, ledger, SSE snapshot+deltas, faux model + mock Jev tests) unless a change
    explicitly replaces them.
  - v0 (complete) was built as a pyramid: v0-0-skeleton -> v0-1-project-setup -> v0-2-paper-sources ->
    v0-3-daily-sweep -> v0-4-feedback -> v0-5-knowledge-vault. v1 follows EVOLUTION.md §6, in order:
    v1-0-plugin-core (done) -> v1-1-lite-daily-cycle -> v1-2-harness -> v1-3-self-improvement ->
    v1-4-knowledge-loop; full text, the Upgrades tab, the engineer, fine-tuning and MCP come later. Apply and
    archive each before the next. A change must not add requirements to a capability owned by an earlier change except as
    MODIFIED deltas.
  - Plugin architecture (from v1-0, EVOLUTION.md §2): a small kernel and plugins for every feature, modeled on
    VS Code extensions. Each plugin has an rh-plugin.json manifest (id, version, engines.research-hub,
    main/browser entries, activationEvents, declarative contributes, dependencies, permissions), is
    activated lazily through activate(context) and stopped through deactivate(), may export an API to its
    dependents, and reaches the system only through the versioned rh kernel API. Extension points are owned
    by the plugin that offers them (Backstage style); prefer many small points. New features are plugins,
    never kernel code, unless they are a kernel service. Built-in plugins run in-process; third-party and
    agent-written code runs in a separate plugin host with declared permissions; process plugins (Python
    tools, MCP servers, Ignis) are supervised child processes. Plugin state per project lives in
    data/plugins (a git repo with plugins.lock.json); every change is a commit and can be rolled back.
  - Autonomy (EVOLUTION.md §0): fixes to the finding loop (queries, thresholds, weights, Jev/prompt wording,
    embedder choice) that win on the harness's held-out judgments are applied automatically as plugin-state
    commits and listed in the "What changed" feed and the weekly digest with one-click undo. Never experiment on
    the live feed. Charter changes, noticeable cost increases and outside upgrades wait for the user's approval.
  - Product upgrades from outside go through the Upgrades tab (EVOLUTION.md §3, later): idea (found by a scout on the internet:
    web search through OpenRouter, arXiv, release feeds, model catalogs) -> the user asks for a test -> the
    agent tests the candidate beside the current plugin on the same inputs -> a proof report (metrics with
    confidence intervals, side-by-side examples, a pairwise judge with swapped positions, optional user
    votes) -> the user asks to implement -> verification after 7 days with one-click rollback. The user
    decides at every gate; no hidden experiments; nothing is implemented without the user's request.
  - Paper sources are keyless (arXiv, OpenAlex, Europe PMC, bioRxiv); Semantic Scholar only with
    S2_API_KEY. Embeddings come from one configured OpenRouter embedding model for all papers.
  - Jev input is title/abstract-sized text (max 30,000 bytes); never send full texts to Jev.
  - Stack (from v1-0): Node 26 LTS, npm workspaces, TypeScript 6.0 (not 7.x until 7.1 is stable and vue-tsc
    supports it), Vite+ 1.x as the single toolchain (vp: Vite 8 build and dev server, Vitest 5 tests, Oxlint
    linting, Oxfmt formatting, task caching, one config); formatting and linting are enforced checks that must
    pass. Vue 3.5 + Vue Router 5 + Pinia 4; plugin UIs as Web Components; Playwright 1.64 for UI tests. Pin
    @earendil-works/pi-durable, pi-ai, chord at an exact version (1.4.0 from v1-0; v0 used 1.1.0). Server tests
    may stay on node:test (run through vp tasks); new UI unit tests use Vitest.
    pi-durable is experimental: all direct usage stays inside packages/durable-agent.
  - Express 5 API + SSE; Vue 3 UI built with Vite+. One Docker container per project, data in its own /data
    volume; every helper process (e.g. the Ignis viewer) runs inside that container, supervised by the
    hub, reachable only through the hub. The default image stays light (target under 300 MB: the server
    bundled, no unused SDKs); heavy optional parts (Obsidian/Ignis, Python tools) are add-on images. Routes carry no project segment.
  - Project containers never interfere: data-directory ownership lock, own port, own compose name
    (rh-<name>), own host name (<name>.localhost), resource limits, staggered sweep times. Containers
    never talk to each other.
  - Providers: OpenRouter (OPENROUTER_API_KEY) for all LLMs, embeddings and Jev (pinned typesafe/jev-1.14),
    so models can be switched by configuration. Model IDs per job live in configuration, never in
    code. Everything goes through OpenRouter: no direct TypeSafe or Anthropic keys, no Claude
    subscription tokens.
  - Jev first: any bounded judgment (yes/no, choice, score) goes to a Jev command, not the main
    LLM. The LLM is for writing, synthesis and orchestration only. Every Jev decision has a review
    band that escalates or asks the user instead of auto-deciding.
  - Storage: SQLite per project (agent.sqlite for pi-durable, project.sqlite for the app,
    FTS5 + sqlite-vec). The vault (markdown) is the source of truth for knowledge; indexes must be
    rebuildable from it. The agent never overwrites user edits in the vault.
  - Agents get only custom paper tools (no bash/file tools). Paper text is data, never instructions.
  - Tests run offline by default (faux model, JEV_BACKEND=mock); live calls only when authorized.

rules:
  proposal:
    - State what is out of scope.
    - Name which Jev commands and which LLM calls the change adds or changes.
  specs:
    - Every requirement has at least one WHEN/THEN scenario that can become a test.
    - Thresholds and defaults are stated as numbers.
  design:
    - Note any deviation from the vendored news-agent patterns and why.
  tasks:
    - Every task group ends with the tests that prove it, runnable offline.
