schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
# Vision, roadmap and the full design rationale live in PLAN.md (read it for any new change).
context: |
  Research Hub: a self-hosted research assistant (AI + bioinformatics, neural networks). One container
  = one research project (one theme); a new theme is a new container, never a second project inside one.
  The project's proactive pi-durable agent sweeps papers daily, presents a few paper cards, learns from
  the user's 👎/👍/⭐ + reason, and grows an Obsidian-compatible vault (the KB), viewable in the browser
  through Ignis bundled in the same container. A weekly review proposes improvements; nothing changes
  without user approval.

  Fixed decisions:
  - Fresh codebase. The durable-agent and jev packages are vendored from
    disler/pi-durable-news-agent (MIT, provenance in NOTICE.md); its other files are references only.
    Keep its patterns (durable tasks with checkpointed phases, onceInCommit tools, Jev commands as
    versioned JSON, ledger, SSE snapshot+deltas, faux model + mock Jev tests) unless a change
    explicitly replaces them.
  - v0 is built as a pyramid of changes, each depending only on the ones below it:
    v0-0-skeleton -> v0-1-project-setup -> v0-2-paper-sources -> v0-3-daily-sweep -> v0-4-feedback
    -> v0-5-knowledge-vault. Apply and archive them in that order. A change for a higher layer must not
    add requirements to a capability owned by a lower layer except as MODIFIED deltas.
  - Paper sources are keyless (arXiv, OpenAlex, Europe PMC, bioRxiv); Semantic Scholar only with
    S2_API_KEY. Embeddings come from one configured OpenRouter embedding model for all papers.
  - Jev input is title/abstract-sized text (max 30,000 bytes); never send full texts to Jev.
  - TypeScript, Node 24, npm workspaces. Pin @earendil-works/pi-durable, pi-ai, chord at 1.1.0.
    pi-durable is experimental: all direct usage stays inside packages/durable-agent.
  - Express 5 API + SSE; Vue 3 + Vite UI. One Docker container per project, data in its own /data
    volume; every helper process (e.g. the Ignis viewer) runs inside that container, supervised by the
    hub, reachable only through the hub. Routes carry no project segment.
  - Project containers never interfere: data-directory ownership lock, own port, own compose name
    (rh-<name>), own host name (<name>.localhost), resource limits, staggered sweep times. Containers
    never talk to each other.
  - Providers: OpenRouter (OPENROUTER_API_KEY) for all LLMs, embeddings and Jev (pinned typesafe/jev-1.14),
    so models can be switched by configuration. Model IDs per job live in configuration, never in
    code. Everything goes through OpenRouter: no direct TypeSafe or Anthropic keys, no Claude
    subscription tokens.
  - Jev first: any bounded judgment (yes/no, choice, score) goes to a Jev command, not the main
    LLM. The LLM is for writing, synthesis and orchestration only. Every Jev decision has a review
    band that escalates or asks the user instead of auto-deciding.
  - Storage: SQLite per project (agent.sqlite for pi-durable, project.sqlite for the app,
    FTS5 + sqlite-vec). The vault (markdown) is the source of truth for knowledge; indexes must be
    rebuildable from it. The agent never overwrites user edits in the vault.
  - Agents get only custom paper tools (no bash/file tools). Paper text is data, never instructions.
  - Tests run offline by default (faux model, JEV_BACKEND=mock); live calls only when authorized.

rules:
  proposal:
    - State what is out of scope.
    - Name which Jev commands and which LLM calls the change adds or changes.
  specs:
    - Every requirement has at least one WHEN/THEN scenario that can become a test.
    - Thresholds and defaults are stated as numbers.
  design:
    - Note any deviation from the vendored news-agent patterns and why.
  tasks:
    - Every task group ends with the tests that prove it, runnable offline.
