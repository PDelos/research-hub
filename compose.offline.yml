# Keyless demo: fake model + mock Jev, no network calls, no .env needed.
#   docker compose -f compose.offline.yml up -d        then open http://demo.localhost:4850
name: rh-${RH_PROJECT_NAME:-demo}
services:
  research-hub:
    build: .
    image: research-hub:latest
    environment:
      RH_PROJECT_NAME: ${RH_PROJECT_NAME:-demo}
      RH_MODE: offline
      RH_HOST: 0.0.0.0
      RH_PORT: "4850"
      RH_DATA_DIR: /data
      RH_ENV_FILE: none
    ports:
      - "127.0.0.1:${RH_PUBLISH_PORT:-4850}:4850"
    volumes:
      - ${RH_HOST_DATA_DIR:-./data-offline}:/data
    mem_limit: ${RH_MEM_LIMIT:-2g}
    cpus: ${RH_CPUS:-2}
    restart: unless-stopped
