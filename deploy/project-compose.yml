# Generated by new-project.sh for project __NAME__. One research project = one container.
#   docker compose up -d        then open http://__NAME__.localhost:${RH_PUBLISH_PORT}
name: rh-__NAME__
services:
  research-hub:
    image: research-hub:latest
    build: __REPO__
    env_file: .env
    environment:
      RH_HOST: 0.0.0.0
      RH_PORT: "4850"
      RH_DATA_DIR: /data
      RH_ENV_FILE: none
    ports:
      - "127.0.0.1:${RH_PUBLISH_PORT}:4850"
    volumes:
      - ./data:/data
    mem_limit: ${RH_MEM_LIMIT:-2g}
    cpus: ${RH_CPUS:-2}
    restart: unless-stopped
