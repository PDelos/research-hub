# Live hub: needs a .env with OPENROUTER_API_KEY (see .env.example).
#   docker compose up -d        then open http://localhost:4850
# Another hub on the same machine: copy this folder, change the published port and the data folder.
services:
  research-hub:
    build: .
    image: research-hub:latest
    env_file: .env
    environment:
      RH_HOST: 0.0.0.0
      RH_DATA_DIR: /data
      RH_ENV_FILE: none
    ports:
      - "127.0.0.1:${RH_PUBLISH_PORT:-4850}:4850"
    volumes:
      - ${RH_HOST_DATA_DIR:-./data}:/data
    restart: unless-stopped
